<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{layout/main :: layout-head}">
    <title>Profil Detayları</title>
    <link rel="stylesheet" th:href="@{/css/custom/list_profile.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<main class="flex-grow-1">
    <div th:replace="~{layout/main :: navbar}"></div>

    <section class="py-5">
        <div class="container px-4">
            <div th:replace="~{layout/main :: alerts}"></div>

            <div th:if="${profileForm == null}" class="text-center py-5 bg-white rounded-4 shadow-sm border">
                <div class="mb-3">
                    <i class="bi bi-person-x text-muted display-1"></i>
                </div>
                <h2 class="h3 fw-bold text-dark">Profil Bulunamadı</h2>
                <p class="text-muted mb-4">Ulaşmaya çalıştığınız profil artık mevcut olmayabilir.</p>
                <a class="btn btn-primary px-4 rounded-pill shadow-sm" th:href="@{/templates/profile}">
                    <i class="bi bi-arrow-left me-2"></i>Geri Dön
                </a>
            </div>

            <div th:if="${profileForm != null}" class="row g-4 align-items-stretch justify-content-center">
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100 text-center p-4">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <div class="position-relative mb-4">
                                <div class="profile-avatar-glow">
                                    <img th:src="${(profileForm.imageUrl != null && !profileForm.imageUrl.isEmpty()) ? profileForm.imageUrl : '/images/profile_image.png'}"
                                         class="rounded-circle shadow border border-4 border-white"
                                         alt="Profile image"
                                         style="width: 180px; height: 180px; object-fit: cover;">
                                </div>
                                <span class="position-absolute bottom-0 end-0 translate-middle p-2 border border-light rounded-circle shadow-sm"
                                      th:classappend="${profileForm.enabled} ? 'bg-success' : 'bg-secondary'"
                                      style="width: 20px; height: 20px;"
                                      th:title="${profileForm.enabled ? 'Aktif' : 'Pasif'}">
                               </span>
                            </div>

                            <h3 class="fw-bold text-dark mb-1" th:text="${profileForm.fullName}">Name</h3>
                            <p class="text-muted small mb-4" th:text="${profileForm.email}">email@example.com</p>
                            <div class="mb-4">
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill">
                                        <i class="bi bi-shield-check me-1"></i> Verified Profile
                                    </span>
                            </div>

                            <div class="list-group list-group-flush profile-nav-menu">
                                <a href="#" class="list-group-item list-group-item-action active">
                                    <i class="bi bi-person me-3"></i> About
                                </a>
                                <a href="#" class="list-group-item list-group-item-action">
                                    <i class="bi bi-heart me-3"></i> Saved Recipes
                                </a>
                                <a href="#" class="list-group-item list-group-item-action">
                                    <i class="bi bi-gear me-3"></i> Settings
                                </a>
                                <a href="#" class="list-group-item list-group-item-action text-muted border-top">
                                    <i class="bi bi-box-arrow-right me-3"></i> Logout
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-5 h-100 main-detail-card">
                        <div class="card border-0 shadow-sm rounded-4 h-100">
                            <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                                <h4 class="fw-bold mb-0 text-dark">ABOUT</h4>
                                <div class="badge rounded-pill px-3 py-2"
                                     th:classappend="${profileForm.enabled} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'">
                                    <i class="bi me-1"
                                       th:classappend="${profileForm.enabled} ? 'bi-check-circle' : 'bi-pause-circle'"></i>
                                    <span th:text="${profileForm.enabled ? 'Active' : 'Passive'}"></span>
                                </div>
                            </div>


                            <div class="card-body p-4 px-lg-5">
                                <div class="info-field-group mb-4">
                                    <div class="d-flex align-items-center py-2">
                                        <i class="bi bi-person text-muted me-3 fs-5"></i>
                                        <span class="text-muted small fw-bold flex-grow-1">Name</span>
                                        <span class="text-dark fw-semibold"
                                              th:text="${profileForm.fullName}">Deniz</span>
                                </div>
                                    <hr class="field-divider">
                                </div>

                                <div class="info-field-group mb-4">
                                    <div class="d-flex align-items-center py-2">
                                        <i class="bi bi-envelope text-muted me-3 fs-5"></i>
                                        <span class="text-muted small fw-bold flex-grow-1">E-Mail</span>
                                        <span class="text-dark fw-semibold"
                                              th:text="${profileForm.email}">test3@example.com</span>
                                    </div>
                                    <hr class="field-divider">
                                </div>

                                <div class="info-field-group mb-5">
                                    <div class="d-flex align-items-center mb-3">
                                        <i class="bi bi-journal-text text-muted me-3 fs-5"></i>
                                        <span class="text-muted small fw-bold">Biography</span>
                                    </div>
                                    <div class="bio-display-box p-4 rounded-4"
                                         th:utext="${#strings.replace(profileForm.bio, '\n', '<br/>')}">
                                        Hello Deniz
                                </div>
                            </div>

                                <div class="text-end">
                                    <a th:href="@{'/user/update-profile'}" class="btn btn-primary-modern px-5 py-2">
                                        <i class="bi bi-pencil-fill me-2 small"></i> UPDATE
                                    </a>
                                </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>


<div th:replace="~{layout/main :: footer}"></div>
<script th:replace="~{layout/main :: scripts}"></script>

</body>
</html>
